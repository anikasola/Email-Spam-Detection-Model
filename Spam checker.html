<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Spam checker</title>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--ink:#151a30;--mute:#6a7088;--line:#e3e5ec;--soft:#f6f7fa;--spam:#b3202f;--spambg:#fbe9eb;--ham:#1f6f5a;--hambg:#e3f3ee;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1220;--ink:#eceff8;--mute:#9aa1bb;--line:#262c45;--soft:#151a2e;--spam:#ff7d8c;--spambg:#3a1c25;--ham:#5fd4b3;--hambg:#12352d}}
:root[data-theme="dark"]{--bg:#0e1220;--ink:#eceff8;--mute:#9aa1bb;--line:#262c45;--soft:#151a2e;--spam:#ff7d8c;--spambg:#3a1c25;--ham:#5fd4b3;--hambg:#12352d}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:'EB Garamond',Garamond,Georgia,serif;font-size:19px;line-height:1.5}
.app{min-height:100%;display:grid;grid-template-columns:1fr 1fr}
@media(min-width:821px){.app{height:100%}.left,.right{height:100%;overflow-y:auto}}
@media(max-width:820px){.app{grid-template-columns:1fr}.left textarea{min-height:200px}}
.left,.right{padding:36px clamp(20px,4vw,56px);display:flex;flex-direction:column}
.right{background:var(--soft);border-left:1px solid var(--line)}
h1{font-size:clamp(34px,4.5vw,52px);font-weight:500;margin:0 0 4px;letter-spacing:-.01em;line-height:1.1}
.sub{color:var(--mute);margin:0 0 18px}
textarea{flex:1;min-height:240px;width:100%;border:1px solid var(--line);border-radius:8px;padding:18px;font:inherit;font-size:20px;background:var(--bg);color:var(--ink);resize:none}
textarea:focus,button:focus-visible,input:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.lbl{color:var(--mute);font-size:16px;margin:16px 0 6px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
button{font:inherit;font-size:17px;border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:4px 14px;border-radius:99px;cursor:pointer}
button:hover{border-color:var(--ink)}
.chips .s{color:var(--spam)}.chips .h{color:var(--ham)}
.tabs{display:flex;gap:22px;border-bottom:1px solid var(--line);align-items:center}
.tabs .tab{border:0;border-bottom:2px solid transparent;border-radius:0;background:none;padding:6px 0;font-size:20px;color:var(--mute)}
.tabs .tab[aria-selected=true]{border-color:var(--ink);color:var(--ink);font-weight:600}
.tabs .theme{margin-left:auto;font-size:16px;margin-bottom:4px}
.result{flex:1;padding-top:8px}
.empty{color:var(--mute);font-size:22px;margin-top:20px}
.verdict{font-size:clamp(56px,8vw,96px);font-weight:500;line-height:1;margin:14px 0 0;letter-spacing:-.02em}
.verdict.spam{color:var(--spam)}.verdict.ham{color:var(--ham)}
.conf{font-size:22px;font-weight:500;margin:8px 0 0}
.pct{font-size:19px;color:var(--mute);margin:0 0 12px}
.bar{height:10px;border-radius:5px;background:var(--hambg);overflow:hidden}
.bar i{display:block;height:100%;background:var(--spam);width:0;transition:width .25s}
h2{font-size:20px;font-weight:600;margin:24px 0 8px}
.words{display:flex;flex-wrap:wrap;gap:8px}
.w{font-size:18px;padding:1px 12px;border-radius:99px}
.w.s{background:var(--spambg);color:var(--spam)}.w.h{background:var(--hambg);color:var(--ham)}
.note{color:var(--mute);font-size:16px;margin:10px 0 0}
.notice{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 14px;margin-top:14px;font-size:18px}
.met{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:18px}
.met b{display:block;font-size:38px;font-weight:500;line-height:1.1}
.met span{color:var(--mute);font-size:16px}
.cm{border-collapse:collapse;width:100%;margin-top:18px;text-align:center;font-size:17px}
.cm td,.cm th{border:1px solid var(--line);padding:8px;font-weight:400;background:var(--bg)}
.steps{padding-left:22px;margin:14px 0}.steps li{margin-bottom:14px}.steps b{font-weight:600}
.filters{border-top:1px solid var(--line);padding-top:4px;margin-top:20px}
.f{margin-top:14px}
.f .top{display:flex;justify-content:space-between;font-weight:500}
.f small{display:block;color:var(--mute);font-size:16px;line-height:1.3;margin-bottom:4px}
input[type=range]{width:100%;accent-color:var(--ink)}
</style>
</head>
<body>
<div class="app">
<section class="left">
<h1>Is this email spam?</h1>
<p class="sub">Paste an email and the verdict updates as you type.</p>
<textarea id="inp" placeholder="Paste the subject and body here" aria-label="Email text"></textarea>
<div class="lbl">Try an example</div>
<div class="chips" id="samples"></div>
<div id="histwrap" hidden><div class="lbl">Recently checked</div><div class="chips" id="hist"></div></div>
<div class="chips" style="margin-top:14px"><button id="clr">Clear</button></div>
</section>
<section class="right">
<div class="tabs" role="tablist">
<button class="tab" role="tab" data-tab="result" aria-selected="true">Result</button>
<button class="tab" role="tab" data-tab="metrics" aria-selected="false">Metrics</button>
<button class="tab" role="tab" data-tab="how" aria-selected="false">How it works</button>
<button class="theme" id="theme">Dark mode</button>
</div>
<div class="result" id="out" aria-live="polite"></div>
<div class="filters">
<div class="f"><div class="top"><span>Smoothing (alpha)</span><span id="av">1.0</span></div><small>Higher values give words the model has rarely seen less influence.</small><input type="range" id="alpha" min="0.1" max="3" step="0.1" value="1" aria-label="Smoothing alpha"></div>
<div class="f"><div class="top"><span>Spam threshold</span><span id="tv">0.50</span></div><small>Lower catches more spam but may flag real mail. Higher is more cautious.</small><input type="range" id="thr" min="0.1" max="0.95" step="0.05" value="0.5" aria-label="Spam threshold"></div>
</div>
</section>
</div>
<script>
const SPAM=["WINNER! Claim your free $1000 gift card now, click here","Congratulations, you won a free iPhone. Act now, limited offer!!!","Cheap meds online, no prescription needed, buy now and save 80%","URGENT: your account is suspended, verify your password here http://bit.ly/x1","Make $5000 a week working from home, guaranteed income, click now","You have been selected for a free cruise. Reply now to claim your prize","Lowest mortgage rates, apply now, no credit check, 100% free quote","Hot singles in your area want to meet you, click here free","Earn easy money fast, no experience needed, limited time offer","Final notice: claim your lottery winnings of $850,000 today","Free viagra and cialis, discount pills, order now, satisfaction guaranteed","Your PayPal account is locked, confirm your details immediately http://secure-login.biz","Double your bitcoin in 24 hours, risk free investment, act now!!!","Get rich quick! Exclusive deal, buy now and win cash prizes","Dear friend, I am a prince and need your help to transfer $10 million, send bank details","Free trial, no obligation, cancel anytime, click to unlock your bonus","Increase your followers fast, buy cheap likes, special discount today","Weight loss miracle pill, lose 30 pounds in 2 weeks, order free sample","You are our lucky winner! Click the link to redeem your reward voucher","Save big on luxury watches, replica designer brands, cheap prices, buy today","Act fast, only 3 left! Free shipping and an extra 90% off, click here","Credit card offer: pre-approved for $20000, no fees, apply now"];
const HAM=["Hi team, the project meeting is moved to 3pm tomorrow in room 204","Can you send me the slides from yesterday's presentation before Friday?","Reminder: your dentist appointment is on Tuesday at 10am","Thanks for the update, I reviewed the document and left a few comments","Lunch on Thursday? Let me know what works for you","Attached is the quarterly report, please review and share feedback","Your order has shipped and should arrive by Wednesday, tracking number inside","Happy birthday! Hope you have a great day, see you at dinner","Notes from today's standup: deploy is scheduled, tests are passing","Could we reschedule our one on one to next week? I have a conflict","Here is the agenda for Monday's planning session, let me know if I missed anything","Mom said she will visit this weekend, can you pick her up from the airport?","The homework for chapter five is due next class, office hours are Wednesday","Great job on the demo! The client was really happy with the results","Please find the invoice for last month's work attached, thanks again","I fixed the bug in the login page, pull request is ready for review","Are you free for a quick call this afternoon to go over the budget?","The library book you requested is ready for pickup at the front desk","Thanks for coming to the workshop, here are the resources we discussed","Can you proofread my cover letter before I send it in tomorrow?","Team offsite is next month, please fill in your travel dates in the sheet","I'll bring the notes to our study group tonight, see you at seven"];
const SAMPLES=[
["Obvious spam","FREE prize! You won $5000, click here now to claim your cash bonus!!!"],
["Normal work email","Hi Sam, are we still on for the review meeting tomorrow? I attached the notes."],
["Polite phishing","Dear customer, we noticed unusual activity on your account. Please verify your password here http://secure-check.biz to keep your account active."],
["Legit sale email","Our fall sale starts Friday. Members get free shipping on orders over $50. See you in the store!"],
["Friendly prize","Hey! Great news, you were picked for a free gift. Just reply to this email and we will send it over."],
["Short and vague","Please see the attached and let me know."]];
const data=[];for(let i=0;i<22;i++){data.push({t:SPAM[i],y:1});data.push({t:HAM[i],y:0});}
const $=id=>document.getElementById(id);
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const tok=s=>(s.toLowerCase().replace(/https?:\/\/\S+/g,' urltoken ').replace(/\d+/g,' numtoken ').match(/[a-z']+|[$!]/g)||[]);
function train(rows,a){
 const c=[{},{}],n=[0,0],N=[0,0],V=new Set();
 rows.forEach(r=>{const k=r.w||1;N[r.y]+=k;tok(r.t).forEach(w=>{c[r.y][w]=(c[r.y][w]||0)+k;n[r.y]+=k;V.add(w)})});
 return{c,n,N,V:V.size,a,vocab:V};
}
const lp=(m,w,k)=>Math.log(((m.c[k][w]||0)+m.a)/(m.n[k]+m.a*m.V));
function predict(m,text){
 const ws=tok(text).filter(w=>m.vocab.has(w));
 let ls=Math.log(m.N[1]/(m.N[0]+m.N[1])),lh=Math.log(m.N[0]/(m.N[0]+m.N[1]));
 ws.forEach(w=>{ls+=lp(m,w,1);lh+=lp(m,w,0)});
 const p=1/(1+Math.exp(Math.max(-50,Math.min(50,lh-ls))));
 const eff=[...new Set(ws)].map(w=>({w,d:lp(m,w,1)-lp(m,w,0)})).sort((a,b)=>Math.abs(b.d)-Math.abs(a.d));
 return{p,eff};
}
let tab='result',last=null,hist=[],timer,notice='',fixTo=0;
try{(JSON.parse(localStorage.getItem('spamUser'))||[]).forEach(r=>data.push({t:r.t,y:r.y,w:r.w,u:1}))}catch(e){}
const save=()=>{try{localStorage.setItem('spamUser',JSON.stringify(data.filter(r=>r.u).map(r=>({t:r.t,y:r.y,w:r.w}))))}catch(e){}};
function resultHTML(a,th){
 const t=$('inp').value.trim();
 if(!t){last=null;return'<p class="empty">The verdict will show up here once you paste an email.</p>'}
 const r=predict(train(data,a),t),sp=r.p>=th,c=Math.max(r.p,1-r.p),top=r.eff.slice(0,12);
 const conf=c>=.95?'Very confident':c>=.8?'Fairly confident':'Borderline call';
 last=`${sp?'Spam':'Not spam'} (${conf.toLowerCase()}, ${(r.p*100).toFixed(1)}% chance of spam)`;
 fixTo=sp?0:1;const nu=data.filter(r=>r.u).length;
 return`${notice?`<div class="notice">${notice}</div>`:''}<p class="verdict ${sp?'spam':'ham'}">${sp?'Spam':'Not spam'}</p><p class="conf">${conf}</p><p class="pct">${(r.p*100).toFixed(1)}% chance of spam</p><div class="bar"><i style="width:${r.p*100}%"></i></div><h2>Words that moved the score most</h2><div class="words">${top.length?top.map(x=>`<span class="w ${x.d>0?'s':'h'}">${esc(x.w)}</span>`).join(''):'<span class="note">None of these words appeared in the training emails, so the model is going on its starting odds.</span>'}</div><p class="note">Red words lean spam. Green words lean not spam.</p><div class="chips" style="margin-top:16px"><button id="copy">Copy result</button><button id="fix">Wrong? Mark as ${sp?'not spam':'spam'}</button></div><p class="note">Training set: ${data.length-nu} built-in emails${nu?` plus ${nu} you corrected.`:'.'}${nu?' <button id="reset">Reset corrections</button>':''}</p>`;
}
function metricsHTML(a,th){
 const base=data.filter(r=>!r.u),m=train(data.filter(r=>r.u||base.indexOf(r)%5!==4),a),te=base.filter((_,i)=>i%5===4);
 let tp=0,fp=0,fn=0,tn=0;
 te.forEach(r=>{const s=predict(m,r.t).p>=th?1:0;if(r.y&&s)tp++;else if(!r.y&&s)fp++;else if(r.y&&!s)fn++;else tn++});
 const acc=(tp+tn)/te.length,pr=tp+fp?tp/(tp+fp):0,rc=tp+fn?tp/(tp+fn):0,f1=pr+rc?2*pr*rc/(pr+rc):0;
 const pc=v=>(v*100).toFixed(0)+'%';
 return`<h2>How well does it do?</h2><p class="note" style="margin-top:0">Checked on ${te.length} held-out emails the model never trained on. Move the filters below to see the numbers change.</p><div class="met"><div><b>${pc(acc)}</b><span>Accuracy</span></div><div><b>${pc(pr)}</b><span>Precision</span></div><div><b>${pc(rc)}</b><span>Recall</span></div><div><b>${pc(f1)}</b><span>F1</span></div></div><table class="cm"><tr><th></th><th>Predicted spam</th><th>Predicted not spam</th></tr><tr><th>Actually spam</th><td>${tp}</td><td>${fn}</td></tr><tr><th>Actually not spam</th><td>${fp}</td><td>${tn}</td></tr></table><p class="note"><b>Precision</b> is how often a spam flag was right. <b>Recall</b> is how much of the real spam it caught. With so few test emails, treat these as a demo, not a benchmark.</p>`;
}
function howHTML(){
 const m=train(data,1),sp=data.filter(r=>r.y).length;
 return`<h2>How the model decides</h2><ol class="steps"><li><b>Start with the odds.</b> ${sp} of the ${data.length} training emails were spam, so before reading a word, the model starts with those odds.</li><li><b>Check each word.</b> For every word in your email, it asks how often that word showed up in spam compared with normal mail. "Free" leans spam. "Meeting" leans normal.</li><li><b>Combine the clues.</b> It treats each word as a separate clue and adds them up. That simple assumption is the "naive" in Naive Bayes. It adds logarithms instead of multiplying, so long emails don't shrink to zero.</li><li><b>Smooth the edges.</b> A word never seen in spam would break the math, so smoothing (alpha) adds a small pretend count to every word. Higher alpha softens the effect of rare words.</li><li><b>Make the call.</b> The result is a chance of spam. If it's above your threshold, the email is marked spam.</li><li><b>Learn from mistakes.</b> If a verdict is wrong, mark the right answer and your email joins the training set. Corrections are saved in this browser only.</li></ol><p class="note">It trained right here in your browser on ${data.length} labeled emails and ${m.V} distinct words.</p>`;
}
function run(){
 const a=+$('alpha').value,th=+$('thr').value;
 $('av').textContent=a.toFixed(1);$('tv').textContent=th.toFixed(2);
 $('out').innerHTML=tab==='result'?resultHTML(a,th):tab==='metrics'?metricsHTML(a,th):howHTML();
 const cp=$('copy');if(cp)cp.onclick=async()=>{try{await navigator.clipboard.writeText(last);cp.textContent='Copied'}catch(e){cp.textContent='Copy not available here'}};
 const fx=$('fix');if(fx)fx.onclick=()=>{const t=$('inp').value.trim(),ex=data.find(r=>r.u&&r.t===t);let msg='Added as '+(fixTo?'spam':'not spam')+' and retrained.';
  if(ex&&ex.y===fixTo){ex.w=(ex.w||1)+1;msg='Counted again, so this email weighs more now.'}else if(ex){ex.y=fixTo;ex.w=1}else data.push({t,y:fixTo,u:1,w:1});
  save();notice=msg;run()};
 const rs=$('reset');if(rs)rs.onclick=()=>{for(let i=data.length-1;i>=0;i--)if(data[i].u)data.splice(i,1);save();notice='Your corrections were cleared.';run()};
}
function pushHist(){
 const t=$('inp').value.trim();if(t.length<15||(hist[0]&&hist[0].t===t))return;
 const sp=predict(train(data,+$('alpha').value),t).p>=+$('thr').value;
 hist.unshift({t,sp});hist=hist.slice(0,5);
 $('histwrap').hidden=false;
 $('hist').innerHTML=hist.map((h,i)=>`<button class="${h.sp?'s':'h'}" data-i="${i}">${esc(h.t.slice(0,26))}${h.t.length>26?'...':''}</button>`).join('');
 $('hist').querySelectorAll('button').forEach(b=>b.onclick=()=>{notice='';$('inp').value=hist[+b.dataset.i].t;tab='result';sync();run()});
}
function sync(){document.querySelectorAll('.tab').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===tab))}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;sync();run()});
$('inp').oninput=()=>{notice='';run();clearTimeout(timer);timer=setTimeout(pushHist,1200)};
$('alpha').oninput=run;$('thr').oninput=run;
$('samples').innerHTML=SAMPLES.map((s,i)=>`<button data-s="${i}">${s[0]}</button>`).join('');
document.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{notice='';$('inp').value=SAMPLES[+b.dataset.s][1];tab='result';sync();run();pushHist()});
$('clr').onclick=()=>{notice='';$('inp').value='';run();$('inp').focus()};
$('theme').onclick=()=>{const r=document.documentElement,dark=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches;r.dataset.theme=dark?'light':'dark';$('theme').textContent=dark?'Dark mode':'Light mode'};
if(matchMedia('(prefers-color-scheme:dark)').matches)$('theme').textContent='Light mode';
run();
</script>
</body>
</html>
